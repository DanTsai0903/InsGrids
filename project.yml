name: InsGrids
options:
  bundleIdPrefix: com.insgrids
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

targets:
  InsGrids:
    type: application
    platform: iOS
    sources:
      - path: InstaBorderApp
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
    resources:
      - path: InstaBorderApp/Resources/Fonts
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.insgrids.app
        INFOPLIST_FILE: InstaBorderApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 2
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
    info:
      path: InstaBorderApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hant
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        CFBundleDisplayName: InsGrids
        UIAppFonts:
          - CactusClassicalSerif-Regular.ttf
          - ChironGoRoundTC-VariableFont_wght.ttf
          - ChironHeiHK-Italic-VariableFont_wght.ttf
          - ChironHeiHK-VariableFont_wght.ttf
          - ChironSungHK-Italic-VariableFont_wght.ttf
          - ChironSungHK-VariableFont_wght.ttf
          - ChocolateClassicalSans-Regular.ttf
          - LXGWWenKaiMonoTC-Bold.ttf
          - LXGWWenKaiMonoTC-Light.ttf
          - LXGWWenKaiMonoTC-Regular.ttf
          - LXGWWenKaiTC-Bold.ttf
          - LXGWWenKaiTC-Light.ttf
          - LXGWWenKaiTC-Regular.ttf
