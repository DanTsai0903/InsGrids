name: InsGrids
options:
  bundleIdPrefix: com.insgrids
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "14.0"

targets:
  InsGrids:
    type: application
    platform: iOS
    sources:
      - path: InstaBorderApp
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.insgrids.app
        INFOPLIST_FILE: InstaBorderApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
    info:
      path: InstaBorderApp/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        CFBundleDisplayName: InsGrids
        NSPhotoLibraryUsageDescription: InsGrids 需要存取您的相簿以選取照片進行編輯。
        NSPhotoLibraryAddUsageDescription: InsGrids 需要權限將編輯後的照片儲存到您的相簿。
